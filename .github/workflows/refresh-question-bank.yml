name: Refresh free question bank

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    paths:
      - "tools/build_question_bank.py"
      - ".github/workflows/refresh-question-bank.yml"

concurrency:
  group: scorefree-question-bank-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ScoreFree
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build from free/open sources
        run: python tools/build_question_bank.py
      - name: Commit generated question bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-bank.generated.js clerk-mains.html
          if git diff --cached --quiet; then
            echo "Question bank unchanged."
          else
            git commit -m "Refresh generated open question bank"
            git pull --rebase origin main
            git push
          fi
