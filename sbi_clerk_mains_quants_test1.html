<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI Clerk Mains - Quants Test 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; color: #333; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e293b; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: bold; color: #38bdf8; font-size: 1.2rem; }
        .timer { background: #0f172a; padding: 6px 14px; border-radius: 6px; color: #f59e0b; font-weight: bold; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .q-box { flex: 1; padding: 24px; background: white; overflow-y: auto; display: flex; flex-direction: column; }
        .q-header { display: flex; justify-content: space-between; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .q-num { font-weight: bold; color: #2563eb; }
        .q-text { font-size: 1.05rem; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
        .opt-item { display: flex; align-items: center; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .opt-item.selected { border-color: #2563eb; background: #dbeafe; font-weight: 600; }
        .opt-item input { margin-right: 12px; }
        .nav-btns { margin-top: auto; display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid #e2e8f0; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-green { background: #16a34a; color: white; }
        .sidebar { width: 300px; background: #f8fafc; border-left: 1px solid #e2e8f0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .p-btn { height: 36px; border: 1px solid #cbd5e1; background: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .p-btn.ans { background: #22c55e; color: white; }
        .p-btn.skip { background: #ef4444; color: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <header>
        <div class="brand">ScoreFree</div>
        <div>SBI Clerk Mains - Quants Test 1 (50 Qs)</div>
        <div class="timer" id="timer">45:00</div>
    </header>
    <div class="main">
        <div class="q-box">
            <div class="q-header">
                <span class="q-num" id="qNum">Question 1</span>
                <span id="qTopic">Quantitative Aptitude</span>
            </div>
            <div class="q-text" id="qText">Loading...</div>
            <div id="opts"></div>
            <div class="nav-btns">
                <button class="btn" onclick="prevQ()">Previous</button>
                <button class="btn btn-blue" onclick="nextQ()">Save & Next</button>
            </div>
        </div>
        <div class="sidebar">
            <h3>Question Palette</h3>
            <div class="grid" id="palette"></div>
            <button class="btn btn-green" style="width:100%" onclick="submitTest()">Submit Test</button>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="card">
            <h2>Test Result</h2>
            <h1 id="score" style="color:#2563eb; margin: 15px 0;">0</h1>
            <button class="btn btn-blue" onclick="location.reload()">Retake Test</button>
        </div>
    </div>
    <script>
        const questions = Array.from({length: 50}, (_, i) => ({
            num: i + 1,
            topic: i < 20 ? "Data Interpretation" : (i < 35 ? "Arithmetic & Mensuration" : "Data Sufficiency"),
            text: `Q${i+1}. In a mixture of ${100 + i*5} litres, the ratio of milk to water is 4:1. If ${10 + i} litres of water is added, what is the new ratio of milk to water?`,
            opts: ["A) 2:1", "B) 3:1", "C) 4:3", "D) 5:2", "E) None of these"],
            ans: "A"
        }));

        let cur = 0, userAns = new Array(50).fill(null), visited = new Array(50).fill(false), timeLeft = 2700;

        setInterval(() => {
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timer').textContent = `${m}:${s < 10 ? '0':''}${s}`;
            if (timeLeft > 0) timeLeft--;
        }, 1000);

        function renderPalette() {
            let p = document.getElementById('palette');
            p.innerHTML = '';
            questions.forEach((_, i) => {
                let b = document.createElement('button');
                b.className = 'p-btn' + (userAns[i] !== null ? ' ans' : (visited[i] ? ' skip' : ''));
                b.textContent = i + 1;
                b.onclick = () => loadQ(i);
                p.appendChild(b);
            });
        }

        function loadQ(i) {
            cur = i;
            visited[i] = true;
            let q = questions[i];
            document.getElementById('qNum').textContent = `Question ${i + 1} of 50`;
            document.getElementById('qTopic').textContent = q.topic;
            document.getElementById('qText').textContent = q.text;
            
            let html = '';
            q.opts.forEach((o, idx) => {
                html += `<label class="opt-item ${userAns[i] === idx ? 'selected' : ''}">
                    <input type="radio" name="opt" ${userAns[i] === idx ? 'checked' : ''} onclick="sel(${idx})"> ${o}
                </label>`;
            });
            document.getElementById('opts').innerHTML = html;
            renderPalette();
        }

        function sel(idx) { userAns[cur] = idx; loadQ(cur); }
        function nextQ() { if (cur < 49) loadQ(cur + 1); }
        function prevQ() { if (cur > 0) loadQ(cur - 1); }

        function submitTest() {
            let score = 0;
            userAns.forEach((a, i) => {
                if (a !== null) score += (a === 0 ? 1 : -0.25);
            });
            document.getElementById('score').textContent = `${score.toFixed(2)} / 50`;
            document.getElementById('modal').style.display = 'flex';
        }

        loadQ(0);
    </script>
</body>
</html>
